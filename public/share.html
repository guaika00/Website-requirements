<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目只读分享</title><link rel="stylesheet" href="./style.css"></head><body><main class="share-shell"><header><div class="brand-mark">PT</div><div><b>PROJECT TRACKER</b><small>项目只读分享</small></div></header><section id="shareContent" class="share-card">正在加载分享内容…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>const root=document.getElementById('shareContent');(async()=>{try{const token=location.pathname.split('/').filter(Boolean).pop();const c=window.BOARD_CONFIG||{};const db=window.supabase.createClient(c.supabaseUrl,c.supabaseKey);const {data,error}=await db.rpc('board_public_share',{p_token:token});if(error)throw error;if(!data)throw Error('分享链接不存在、已撤销或已过期');const p=data.project;root.innerHTML='<h1></h1><p class="muted"></p><div class="share-table"></div>';root.querySelector('h1').textContent=p.name;root.querySelector('.muted').textContent=p.description||'只读项目摘要';root.querySelector('.share-table').innerHTML='<table><thead><tr><th>需求</th><th>批次</th><th>分类</th><th>优先级</th><th>进度</th><th>截止日期</th></tr></thead><tbody>'+data.requirements.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.iteration||'—')+'</td><td>'+esc(x.category)+'</td><td>'+esc(({urgent:'加急',important:'重点',normal:'普通'})[x.priority]||'普通')+'</td><td>'+esc(({todo:'待开始',doing:'进行中',review:'待验收',done:'已完成'})[x.status]||'待开始')+(x.blocked?' · 阻塞':'')+'</td><td>'+esc(x.due_date||'—')+'</td></tr>').join('')+'</tbody></table><p class="muted">此页面为只读摘要，不包含评论、成员邮箱或私有附件。</p>'}catch(e){root.textContent=e.message||'无法加载分享'}})();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
